name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_ARCH=amd64 -t nano-nvr nano_nvr
      - run: docker run --rm --entrypoint python3 nano-nvr -c "import sys; sys.path.insert(0, '/app'); import nano_nvr"
