<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nano NVR</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1f24;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #0b84d6;
    --ok: #1f9d55;
    --warn: #c27c0e;
    --bad: #d03b3b;
    --bar: #e8ebef;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315;
      --card: #1b1e21;
      --text: #e7e9ec;
      --muted: #9aa1aa;
      --line: #2b2f34;
      --accent: #3aa6f0;
      --ok: #3cc47a;
      --warn: #e2a33a;
      --bad: #ef6161;
      --bar: #2a2e33;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 10px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .stat { padding: 14px 16px; }
  .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar { height: 6px; border-radius: 3px; background: var(--bar); margin-top: 10px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }
  .bar .other { background: var(--muted); opacity: .45; }
  .bar .nvr { background: var(--accent); }

  .mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .cam { overflow: hidden; }
  .cam .shot { display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; position: relative; aspect-ratio: 16 / 9; background: #000; }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa1aa; font-size: 13px; }
  .cam .info { padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cam .name { font-weight: 600; }
  .cam .when { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cam .links { padding: 0 12px 10px; display: flex; gap: 14px; font-size: 13px; }
  a, .link { color: var(--accent); text-decoration: none; }
  .link { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
  a:hover, .link:hover { text-decoration: underline; }
  .cam .err { padding: 0 12px 10px; font-size: 12px; color: var(--bad); word-break: break-word; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; font-weight: 500; color: var(--muted); }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  tfoot td { font-weight: 600; }

  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; padding: 4px 0; }
  .settings div { padding: 8px 16px; }
  .settings dt { font-size: 12px; color: var(--muted); }
  .settings dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dialog.live { padding: 0; border: 0; border-radius: 12px; background: #000; color: #e7e9ec; width: min(1280px, 96vw); max-height: 96vh; overflow: hidden; }
  dialog.live::backdrop { background: rgba(0, 0, 0, .75); }
  .live .frame { position: relative; aspect-ratio: 16 / 9; max-height: calc(96vh - 44px); margin: 0 auto; background: #000 center / contain no-repeat; }
  .live .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .live .frame .placeholder { position: absolute; inset: 0; display: none; place-items: center; font-size: 13px; color: #9aa1aa; background: rgba(0, 0, 0, .6); }
  .live .bar-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; }
  .live .bar-top .name { font-weight: 600; }
  .live .bar-top .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--bad); color: #fff; letter-spacing: .04em; }
  .live .bar-top .spacer { flex: 1; }
  .live .bar-top a, .live .bar-top .link { color: #9ccff5; }
  .live .close { background: none; border: 0; color: #e7e9ec; font-size: 22px; line-height: 1; cursor: pointer; padding: 0 2px; }
  .error-banner { padding: 12px 16px; color: var(--bad); margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Nano NVR</h1>
    <span class="muted" id="meta">Loading…</span>
  </header>

  <div class="card error-banner" id="banner"></div>

  <section class="summary" id="summary"></section>

  <h2>Cameras</h2>
  <section class="mosaic" id="mosaic"></section>

  <h2>Retention</h2>
  <div class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>Camera</th><th>Mode</th><th class="num">Days</th><th>Oldest</th><th>Newest</th>
          <th class="num">Timelapses</th><th class="num">Used</th><th class="num">Avg / day</th>
          <th class="num">At full retention</th>
        </tr>
      </thead>
      <tbody id="retention"></tbody>
      <tfoot id="retention-total"></tfoot>
    </table>
  </div>

  <h2>Settings</h2>
  <dl class="card settings" id="settings"></dl>
</main>

<dialog class="live" id="live">
  <div class="bar-top">
    <span class="tag">LIVE</span><span class="name" id="live-name"></span><span class="spacer"></span>
    <a id="live-image" target="_blank" rel="noopener">Full image ↗</a>
    <button class="close" id="live-close" aria-label="Close">×</button>
  </div>
  <div class="frame" id="live-frame"><img id="live-img" alt=""><div class="placeholder" id="live-msg"></div></div>
</dialog>

<script>
const REFRESH_MS = 30000;
const $ = (id) => document.getElementById(id);

function bytes(n) {
  if (n == null) return "–";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + units[i];
}

function ago(ts, now) {
  if (!ts) return "never";
  const s = Math.max(0, Math.round(now - ts));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

function duration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

function esc(v) {
  return String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function health(cam, now) {
  const last = cam.storage.last_file_at;
  const limit = cam.mode === "snapshot" ? Math.max(3 * cam.interval, 180) : 180;
  const failing = cam.error && (!last || cam.error.at > last);
  if (last && now - last < limit && !failing) return "ok";
  if (last && now - last < 3 * limit) return "warn";
  return "bad";
}

function modeLabel(cam) {
  if (cam.mode === "snapshot") return `snapshot · ${+cam.snapshots_per_minute.toFixed(2)}/min`;
  return cam.fps ? `record · ${cam.fps} fps` : "record";
}

// Link to a folder in the Home Assistant Media browser, opened in the top
// window outside the ingress iframe. Only /media is a media source ("local");
// null for storage under /share.
function mediaUrl(st, ...parts) {
  const m = /^\/media\/(.+?)\/*$/.exec(st.storage_path);
  if (!m) return null;
  let id = "media-source://media_source/local";
  let url = "/media-browser/browser/" + encodeURIComponent("app,media-source://media_source");
  for (const part of [...m[1].split("/"), ...parts]) {
    id += "/" + part;
    url += "/" + encodeURIComponent("," + id);
  }
  return url;
}

function mediaLink(url, text) {
  return url ? `<a href="${esc(url)}" target="_top">${text}</a>` : "";
}

function stat(label, value, sub, extra = "") {
  return `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div>` +
    `<div class="sub">${sub}</div>${extra}</div>`;
}

function renderSummary(st) {
  const now = st.now;
  const ok = st.cameras.filter((c) => health(c, now) === "ok").length;
  const d = st.disk;
  const nvrPct = d.total ? (st.nvr_bytes / d.total) * 100 : 0;
  const otherPct = d.total ? Math.max(0, (d.used - st.nvr_bytes) / d.total) * 100 : 0;
  const projected = st.cameras.reduce((sum, c) => sum + (c.storage.projected_bytes || 0), 0);
  const missing = st.cameras.filter((c) => c.storage.projected_bytes == null).length;
  const fits = projected <= d.free + st.nvr_bytes - st.min_free_gb * 1e9;
  let retentionSub = "estimate after the first full day";
  if (projected && missing) retentionSub = `≈ ${bytes(projected)} when full for ${st.cameras.length - missing} of ${st.cameras.length} cameras`;
  else if (projected) retentionSub = `≈ ${bytes(projected)} when full · ${fits ? "fits on disk" : "will hit the free space limit"}`;
  $("summary").innerHTML = [
    stat("Cameras", `${ok} / ${st.cameras.length}`, ok === st.cameras.length ? "all saving" : "some need attention"),
    stat("Footage", bytes(st.nvr_bytes), `in ${esc(st.storage_path)} ${mediaLink(mediaUrl(st), "Open in Media ↗")}`),
    stat("Disk free", bytes(d.free), `of ${bytes(d.total)} · keeps ≥ ${st.min_free_gb} GB free`,
      `<div class="bar" title="Nano NVR ${bytes(st.nvr_bytes)} · other ${bytes(d.used - st.nvr_bytes)}">` +
      `<span class="nvr" style="width:${nvrPct}%"></span><span class="other" style="width:${otherPct}%"></span></div>`),
    stat("Retention", st.retention_days ? `${st.retention_days} days` : "unlimited", retentionSub),
  ].join("");
}

function renderMosaic(st) {
  const now = st.now;
  const box = $("mosaic");
  const t = Date.now();
  for (const cam of st.cameras) {
    let card = box.querySelector(`[data-cam="${cam.name}"]`);
    if (!card) {
      card = document.createElement("article");
      card.className = "card cam";
      card.dataset.cam = cam.name;
      card.innerHTML = `<button class="shot" title="Live view"><div class="placeholder">Loading preview…</div><img alt=""></button>` +
        `<div class="info"><span class="dot"></span><span class="name"></span><span class="badge"></span><span class="when"></span></div>` +
        `<div class="err"></div>` +
        `<div class="links"><button class="link live-link">Live view</button><a class="full" target="_blank" rel="noopener">Full image ↗</a><a class="media" target="_top">Media folder ↗</a></div>`;
      card.querySelector(".shot").onclick = () => openLive(cam.name);
      card.querySelector(".live-link").onclick = () => openLive(cam.name);
      const img = card.querySelector("img");
      img.alt = cam.name;
      img.onload = () => { card.querySelector(".placeholder").style.display = "none"; img.style.display = ""; };
      img.onerror = () => {
        const p = card.querySelector(".placeholder");
        p.textContent = "No preview";
        p.style.display = "";
        img.style.display = "none";
      };
      box.appendChild(card);
    }
    const src = `preview/${encodeURIComponent(cam.name)}.jpg?t=${t}`;
    card.querySelector("a.full").href = src;
    const media = mediaUrl(st, cam.name);
    card.querySelector("a.media").style.display = media ? "" : "none";
    if (media) card.querySelector("a.media").href = media;
    card.querySelector("img").src = src;
    card.querySelector(".dot").className = "dot " + health(cam, now);
    card.querySelector(".name").textContent = cam.name;
    card.querySelector(".badge").textContent = modeLabel(cam);
    card.querySelector(".when").textContent = "last saved " + ago(cam.storage.last_file_at, now);
    const failing = cam.error && (!cam.storage.last_file_at || cam.error.at > cam.storage.last_file_at);
    card.querySelector(".err").textContent = failing ? `${cam.error.message} (${ago(cam.error.at, now)})` : "";
    card.querySelector(".err").style.display = failing ? "" : "none";
  }
}

function renderRetention(st) {
  $("retention").innerHTML = st.cameras.map((c) => {
    const s = c.storage;
    return `<tr><td>${mediaLink(mediaUrl(st, c.name), esc(c.name)) || esc(c.name)}</td><td>${esc(modeLabel(c))}</td><td class="num">${s.days}</td>` +
      `<td>${s.oldest || "–"}</td><td>${s.newest || "–"}</td><td class="num">${s.timelapses}</td>` +
      `<td class="num">${bytes(s.bytes)}</td><td class="num">${bytes(s.avg_day_bytes)}</td>` +
      `<td class="num">${bytes(s.projected_bytes)}</td></tr>`;
  }).join("");
  const projected = st.cameras.reduce((sum, c) => sum + (c.storage.projected_bytes || 0), 0);
  const avg = st.cameras.reduce((sum, c) => sum + (c.storage.avg_day_bytes || 0), 0);
  const partial = st.cameras.some((c) => c.storage.projected_bytes == null) ? " (partial)" : "";
  $("retention-total").innerHTML = `<tr><td>Total</td><td></td><td></td><td></td><td></td><td></td>` +
    `<td class="num">${bytes(st.nvr_bytes)}</td><td class="num">${avg ? bytes(avg) + partial : "–"}</td>` +
    `<td class="num">${projected ? bytes(projected) + partial : "–"}</td></tr>`;
}

function renderSettings(st) {
  const tl = st.timelapse;
  const items = [
    ["Storage path", st.storage_path, mediaLink(mediaUrl(st), "Open in Media ↗")],
    ["Retention", st.retention_days ? `${st.retention_days} days (today included)` : "unlimited"],
    ["Minimum free space", `${st.min_free_gb} GB`],
    ["Record segments", `${st.segment_minutes} min`],
    ["Timelapse", `${tl.fps} fps · CRF ${tl.quality} · ${tl.height ? tl.height + "p" : "original size"}`],
    ["Snapshots after timelapse", tl.keep_snapshots ? "kept" : "deleted"],
    ...st.cameras.map((c) => [`${c.name}`, c.url]),
  ];
  $("settings").innerHTML = items.map(([k, v, link = ""]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)} ${link}</dd></div>`).join("");
}

// Live view: one JPEG per request, each waiting for a frame newer than the last
// one shown. Works through the ingress proxy, which breaks MJPEG streams.
const LIVE_MAX_MS = 30 * 60 * 1000;
let liveRun = 0;

function liveMessage(text) {
  const msg = $("live-msg");
  msg.textContent = text;
  msg.style.display = text ? "grid" : "none";
}

async function liveLoop(run, cam) {
  const img = $("live-img");
  const started = Date.now();
  let after = 0, failures = 0, shown = null;
  while (run === liveRun) {
    if (Date.now() - started > LIVE_MAX_MS) {
      liveMessage("Live view paused after 30 minutes: close and reopen to continue");
      return;
    }
    try {
      const res = await fetch(`live/${cam}.jpg?after=${after}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const seq = Number(res.headers.get("X-Frame-Seq"));
      after = Number.isFinite(seq) && seq > 0 ? seq : after + 1;
      const url = URL.createObjectURL(await res.blob());
      if (run !== liveRun) { URL.revokeObjectURL(url); return; }
      img.src = url;
      img.style.visibility = "";
      if (shown) URL.revokeObjectURL(shown);
      shown = url;
      failures = 0;
      liveMessage("");
    } catch (e) {
      if (run !== liveRun) return;
      failures++;
      liveMessage(failures < 3 ? "Connecting…" : "Live view unavailable: camera not reachable, retrying");
      await new Promise((r) => setTimeout(r, Math.min(2000 * failures, 10000)));
    }
  }
  if (shown) URL.revokeObjectURL(shown);
}

function openLive(name) {
  const img = $("live-img");
  const cam = encodeURIComponent(name);
  $("live-name").textContent = name;
  $("live-image").href = `preview/${cam}.jpg?t=${Date.now()}`;
  // Last preview as a backdrop until the first live frame paints over it.
  $("live-frame").style.backgroundImage = `url("preview/${cam}.jpg")`;
  img.alt = name;
  img.removeAttribute("src");
  img.style.visibility = "hidden";
  liveMessage("Connecting…");
  $("live").showModal();
  liveLoop(++liveRun, cam);
}

function closeLive() {
  $("live").close();
}

// Bumping the run counter ends the loop; with no more requests ffmpeg stops
// on the add-on after a few seconds.
$("live").addEventListener("close", () => { liveRun++; $("live-img").removeAttribute("src"); });
$("live").addEventListener("click", (e) => { if (e.target === $("live")) closeLive(); });
$("live-close").onclick = closeLive;
document.addEventListener("visibilitychange", () => { if (document.hidden && $("live").open) closeLive(); });

async function refresh() {
  try {
    const res = await fetch("api/status", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const st = await res.json();
    $("banner").style.display = "none";
    $("meta").textContent = `v${st.version} · up ${duration(st.now - st.started_at)} · updated ${new Date().toLocaleTimeString()}`;
    renderSummary(st);
    renderMosaic(st);
    renderRetention(st);
    renderSettings(st);
  } catch (e) {
    $("banner").textContent = "Cannot reach the add-on: " + e.message;
    $("banner").style.display = "block";
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
