---
name: Nano NVR
version: "0.6.0"
slug: nano_nvr
description: >-
  Lightweight RTSP recorder: daily timelapses or continuous recording to
  /media, without camera clouds or SD cards
url: https://github.com/fborraccetti/nano-nvr
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Status panel in the sidebar, reachable only through the authenticated
# Home Assistant ingress proxy: no port is exposed on the LAN.
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: NVR
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
# Options are grouped as shown in the Configuration tab: cameras, storage,
# snapshot mode and timelapse, record mode, logging.
options:
  cameras: []
  storage_path: /media/nano_nvr
  retention_days: 30
  min_free_gb: 5
  require_mount: false
  timelapse_fps: 24
  timelapse_quality: 28
  timelapse_height: 0
  keep_snapshots: false
  segment_minutes: 10
  log_level: info
schema:
  cameras:
    - name: match(^[A-Za-z0-9_-]+$)
      url: match(^rtsps?://.+)
      username: str?
      password: password?
      mode: list(snapshot|record)?
      snapshots_per_minute: float(0.01,60)?
      fps: int(0,30)?
      audio: bool?
      live_url: match(^rtsps?://.+)?
      enabled: bool?
  storage_path: match(^/(media|share)/.+)
  retention_days: int(0,)
  min_free_gb: float(0,)
  require_mount: bool
  timelapse_fps: int(1,60)
  timelapse_quality: int(18,40)
  timelapse_height: int(0,2160)
  keep_snapshots: bool
  segment_minutes: int(1,60)
  log_level: list(debug|info|warning|error)
